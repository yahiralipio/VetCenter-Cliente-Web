
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | VetCenter</title>

    <!-- Bootstrap 5.3 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">

    <!-- Estilos VetCenter -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <!-- MARCA -->
        <div class="brand text-center mb-4">

            <div class="brand-icon">
                <img
                src="/images/Logo_VetCenter.png"
                alt="Logo VetCenter"
                class="vetcenter-logo vetcenter-logo-login"
                >
            </div>

            <h1>VetCenter</h1>

            <p>
                El bienestar de tu mascota comienza aquí.
            </p>

        </div>

        <!-- ENCABEZADO -->
        <div class="mb-4">

            <h2 class="fw-bold">
                Bienvenido de nuevo
            </h2>

            <p class="subtitle">
                Inicia sesión para gestionar tus mascotas,
                consultar sus atenciones y reservar citas.
            </p>

        </div>

        <!-- MENSAJES -->
        <div
                id="mensaje"
                class="alert d-none"
                role="alert"
                aria-live="polite">
        </div>

        <!-- FORMULARIO -->
        <form id="loginForm">

            <!-- CORREO -->
            <div class="mb-3">

                <label
                        for="correo"
                        class="form-label fw-semibold">
                    Correo electrónico
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                            type="email"
                            id="correo"
                            name="correo"
                            class="form-control"
                            placeholder="correo@ejemplo.com"
                            autocomplete="email"
                            maxlength="150"
                            required>

                </div>

            </div>

            <!-- CONTRASEÑA -->
            <div class="mb-4">

                <div class="d-flex justify-content-between align-items-center mb-2">

                    <label
                            for="password"
                            class="form-label fw-semibold mb-0">
                        Contraseña
                    </label>

                </div>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required>

                    <button
                            type="button"
                            id="togglePassword"
                            class="btn btn-outline-secondary"
                            aria-label="Mostrar contraseña"
                            aria-pressed="false">

                        <i
                                id="passwordIcon"
                                class="bi bi-eye">
                        </i>

                    </button>

                </div>

            </div>

            <!-- BOTÓN LOGIN -->
            <button
                    type="submit"
                    id="loginButton"
                    class="btn btn-primary w-100 py-3 fw-semibold">

                <span id="loginButtonText">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Iniciar sesión
                </span>

                <span
                        id="loginSpinner"
                        class="spinner-border spinner-border-sm ms-2 d-none"
                        role="status"
                        aria-hidden="true">
                </span>

            </button>

        </form>

        <!-- REGISTRO -->
        <p class="auth-footer text-center mt-4">

            ¿Todavía no tienes una cuenta?

            <a
                    href="/registro.html"
                    class="fw-semibold text-decoration-none">
                Regístrate aquí
            </a>

        </p>

        <!-- SEGURIDAD -->
        <div class="text-center mt-4">

            <small class="text-muted">
                <i class="bi bi-shield-check me-1"></i>
                Acceso seguro a tu cuenta VetCenter
            </small>

        </div>

    </section>

</main>

<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Login -->
<script src="/js/login.js"></script>

</body>
</html>
