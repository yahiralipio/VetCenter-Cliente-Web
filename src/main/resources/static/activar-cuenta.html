
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Activar cuenta | VetCenter</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<main class="auth-page">
    <section class="auth-card">

        <div class="brand">
            <div class="brand-icon">🐾</div>
            <h1>VetCenter</h1>
            <p>El bienestar de tu mascota comienza aquí.</p>
        </div>

        <h2>Activa tu cuenta</h2>

        <p class="subtitle">
            ¡Bienvenido a VetCenter!
            Crea una contraseña segura para activar
            tu cuenta y comenzar a utilizar nuestros
            servicios veterinarios.
        </p>

        <div
                id="mensaje"
                class="alert d-none"
                role="alert"
                aria-live="polite">
        </div>

        <form id="activacionForm">

            <div class="mb-3">
                <label
                        for="password"
                        class="form-label">
                    Nueva contraseña
                </label>

                <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Mínimo 8 caracteres"
                        minlength="8"
                        autocomplete="new-password"
                        required>
            </div>

            <div class="mb-4">
                <label
                        for="confirmarPassword"
                        class="form-label">
                    Confirmar contraseña
                </label>

                <input
                        type="password"
                        id="confirmarPassword"
                        class="form-control"
                        placeholder="Repite tu contraseña"
                        minlength="8"
                        autocomplete="new-password"
                        required>
            </div>

            <button
                    type="submit"
                    id="activarButton"
                    class="btn btn-primary w-100">
                Activar mi cuenta
            </button>

        </form>

        <p class="auth-footer">
            ¿Ya tienes una cuenta?
            <a href="/login.html">Inicia sesión</a>
        </p>

    </section>
</main>

<script src="/js/activar-cuenta.js"></script>

</body>
</html>
