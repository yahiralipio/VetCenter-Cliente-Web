
# ==========================================
# VETCENTER - CLIENTE SOAP + API REST
# ==========================================

spring.application.name=SOAP-Proj-VetCenter-Client
server.port=8091

# ==========================================
# BASE DE DATOS MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/bdveterinaria
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# CORREO ELECTRONICO - GMAIL SMTP
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# ACTIVACION DE CUENTAS
# ==========================================

vetcenter.app.base-url=http://localhost:8091
vetcenter.activacion.expiracion-horas=24

# Activacion mediante correo electronico real
vetcenter.mail.modo-pruebas=false